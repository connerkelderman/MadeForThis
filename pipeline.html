<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Track CPA — Tax Return Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─── */
:root {
  --bg:           #0c0e14;
  --surface:      #13151f;
  --surface2:     #1c1f2e;
  --surface3:     #22263a;
  --border:       #252838;
  --border-h:     #363a5a;
  --text:         #e2e4f0;
  --text-muted:   #7b7fa8;
  --text-dim:     #4a4d6a;
  --accent:       #5b6af0;
  --accent-h:     #6b7aff;
  --accent-dim:   rgba(91,106,240,.15);
  --green:        #22c97a;
  --green-dim:    rgba(34,201,122,.13);
  --yellow:       #e8a020;
  --yellow-dim:   rgba(232,160,32,.13);
  --red:          #e05454;
  --red-dim:      rgba(224,84,84,.13);
  --purple:       #9b6ef0;
  --purple-dim:   rgba(155,110,240,.13);
  --orange:       #e07840;
  --orange-dim:   rgba(224,120,64,.13);
  --blue:         #4fa8e8;
  --blue-dim:     rgba(79,168,232,.13);
  --pink:         #d45fa8;
  --pink-dim:     rgba(212,95,168,.13);
  --r:            8px;
  --r-sm:         5px;
  --r-lg:         12px;
  --shadow:       0 4px 32px rgba(0,0,0,.5);
  --shadow-sm:    0 2px 12px rgba(0,0,0,.35);
  --nav-h:        56px;
}

/* ─── RESET ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;overflow-x:hidden;line-height:1.5;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit;background:none;border:none;outline:none}
ul{list-style:none}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-h);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}

/* ─── TOP NAV ─── */
.topnav{
  position:sticky;top:0;z-index:100;
  height:var(--nav-h);
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
  padding:0 20px;
  backdrop-filter:blur(8px);
}
.nav-logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.nav-logo-mark{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:#fff;letter-spacing:-.5px;
}
.nav-logo-text{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.2px}
.nav-internal-badge{
  font-size:10px;font-weight:600;letter-spacing:.6px;
  background:var(--accent-dim);color:var(--accent);
  border:1px solid rgba(91,106,240,.3);
  padding:2px 7px;border-radius:20px;text-transform:uppercase;
}
.nav-spacer{flex:1}
.nav-year-select{
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text);padding:5px 10px;border-radius:var(--r-sm);
  font-size:13px;font-weight:500;cursor:pointer;
  transition:border-color .15s;
}
.nav-year-select:hover{border-color:var(--border-h)}
.nav-count-badge{
  background:var(--surface2);border:1px solid var(--border);
  padding:5px 12px;border-radius:var(--r-sm);
  font-size:13px;color:var(--text-muted);
}
.nav-count-badge span{color:var(--text);font-weight:600}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:var(--r-sm);
  font-size:13px;font-weight:500;
  transition:background .15s,border-color .15s,opacity .15s;
  cursor:pointer;white-space:nowrap;
}
.btn-ghost{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted)}
.btn-ghost:hover{border-color:var(--border-h);color:var(--text);background:var(--surface3)}
.btn-primary{background:var(--accent);color:#fff;border:1px solid transparent}
.btn-primary:hover{background:var(--accent-h)}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(224,84,84,.3)}
.btn-danger:hover{background:rgba(224,84,84,.22)}

/* ─── ATTENTION BANNER ─── */
.attention-banner{
  background:linear-gradient(90deg,rgba(232,160,32,.08),rgba(224,84,84,.06));
  border-bottom:1px solid rgba(232,160,32,.2);
  padding:10px 20px;
  display:flex;align-items:flex-start;gap:12px;
  transition:all .3s;
}
.attention-banner.hidden{display:none}
.banner-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.banner-body{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.banner-label{font-size:13px;font-weight:600;color:var(--yellow);white-space:nowrap}
.banner-chips{display:flex;flex-wrap:wrap;gap:6px}
.banner-chip{
  font-size:11px;font-weight:500;
  background:rgba(232,160,32,.12);
  border:1px solid rgba(232,160,32,.25);
  color:#c8901a;padding:2px 9px;border-radius:20px;
  cursor:pointer;transition:background .15s;
}
.banner-chip:hover{background:rgba(232,160,32,.22)}
.banner-chip.red-chip{
  background:rgba(224,84,84,.12);border-color:rgba(224,84,84,.25);color:var(--red);
}
.banner-dismiss{
  flex-shrink:0;font-size:18px;color:var(--text-dim);
  cursor:pointer;transition:color .15s;padding:0 4px;
}
.banner-dismiss:hover{color:var(--text-muted)}

/* ─── TOOLBAR ─── */
.toolbar{
  padding:10px 20px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.search-wrap{
  position:relative;flex:1;min-width:160px;max-width:280px;
}
.search-wrap svg{
  position:absolute;left:9px;top:50%;transform:translateY(-50%);
  color:var(--text-dim);pointer-events:none;
}
.search-input{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:6px 10px 6px 32px;
  font-size:13px;color:var(--text);
  transition:border-color .15s;
}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--text-dim)}
.filter-select{
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text-muted);padding:6px 10px;border-radius:var(--r-sm);
  font-size:13px;cursor:pointer;transition:border-color .15s,color .15s;
}
.filter-select:hover,.filter-select:focus{border-color:var(--border-h);color:var(--text)}
.filter-select.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.toolbar-spacer{flex:1}
.view-toggle{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.view-btn{
  padding:6px 12px;font-size:13px;color:var(--text-muted);
  transition:background .15s,color .15s;display:flex;align-items:center;gap:5px;
}
.view-btn.active{background:var(--surface3);color:var(--text)}
.view-btn:hover:not(.active){background:var(--surface3);color:var(--text-muted)}

/* ─── STATS ROW ─── */
.stats-row{
  display:flex;gap:1px;padding:0 20px 0;
  background:var(--border);
  border-bottom:1px solid var(--border);
}
.stat-cell{
  flex:1;background:var(--surface);
  padding:10px 14px;display:flex;flex-direction:column;gap:2px;
  cursor:pointer;transition:background .15s;min-width:0;
}
.stat-cell:first-child{border-radius:0}
.stat-cell:hover{background:var(--surface2)}
.stat-cell.active{background:var(--surface2);position:relative}
.stat-cell.active::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:var(--accent);
}
.stat-num{font-size:20px;font-weight:700;color:var(--text);line-height:1}
.stat-num.green{color:var(--green)}
.stat-num.yellow{color:var(--yellow)}
.stat-num.blue{color:var(--blue)}
.stat-num.purple{color:var(--purple)}
.stat-num.red{color:var(--red)}
.stat-label{font-size:11px;color:var(--text-muted);font-weight:500;white-space:nowrap}

/* ─── KANBAN ─── */
.kanban-wrapper{
  display:flex;gap:0;
  padding:16px;
  overflow-x:auto;
  flex:1;
  align-items:flex-start;
}
.kanban-col{
  flex:0 0 260px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  display:flex;flex-direction:column;
  max-height:calc(100vh - var(--nav-h) - 200px);
  overflow:hidden;
  transition:border-color .15s,box-shadow .15s;
  margin-right:12px;
}
.kanban-col:last-child{margin-right:0}
.kanban-col.drag-over{
  border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent-dim),var(--shadow-sm);
}
.kanban-col.collapsed{flex:0 0 48px;min-height:80px}
.col-header{
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
  cursor:pointer;user-select:none;flex-shrink:0;
}
.col-header:hover{background:var(--surface2)}
.col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.col-title{font-size:12px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;flex:1;color:var(--text-muted)}
.col-count{
  font-size:11px;font-weight:600;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text-muted);
  padding:1px 7px;border-radius:20px;flex-shrink:0;
}
.col-collapse-btn{color:var(--text-dim);font-size:12px;transition:transform .2s}
.kanban-col.collapsed .col-collapse-btn{transform:rotate(-90deg)}
.kanban-col.collapsed .col-header{
  flex-direction:column;writing-mode:vertical-rl;
  text-orientation:mixed;padding:14px 10px;gap:6px;
  justify-content:flex-start;border-bottom:none;
}
.kanban-col.collapsed .col-title{writing-mode:vertical-rl;font-size:11px}
.kanban-col.collapsed .col-count{writing-mode:horizontal-tb}
.col-body{
  padding:10px;display:flex;flex-direction:column;gap:8px;
  overflow-y:auto;flex:1;
}
.kanban-col.collapsed .col-body{display:none}

/* Drop zone indicator */
.drop-zone{
  height:4px;border-radius:2px;background:var(--accent);
  margin:2px 0;opacity:0;transition:opacity .15s;
  pointer-events:none;
}
.drop-zone.active{opacity:1}

/* ─── KANBAN CARD ─── */
.card{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:var(--r);
  cursor:grab;
  transition:border-color .15s,box-shadow .15s,transform .1s;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--col-color,var(--accent));
}
.card:hover{
  border-color:var(--border-h);
  box-shadow:var(--shadow-sm);
}
.card:active{cursor:grabbing;transform:scale(.98)}
.card.dragging{opacity:.5;box-shadow:var(--shadow)}
.card-main{padding:10px 10px 10px 14px}
.card-top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.type-badge{
  font-size:10px;font-weight:700;letter-spacing:.4px;
  padding:2px 6px;border-radius:4px;white-space:nowrap;flex-shrink:0;
}
.type-1040{background:var(--accent-dim);color:var(--accent)}
.type-1120s{background:var(--purple-dim);color:var(--purple)}
.type-1065{background:var(--blue-dim);color:var(--blue)}
.card-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-bottom:8px}
.meta-tag{
  font-size:10px;font-weight:500;
  padding:1px 6px;border-radius:3px;white-space:nowrap;
}
.meta-year{background:var(--surface3);color:var(--text-muted)}
.meta-state{background:var(--surface3);color:var(--text-muted)}
.meta-ext{background:var(--yellow-dim);color:var(--yellow)}
.ex-tag{font-size:10px;font-weight:600;padding:1px 7px;border-radius:3px}
.ex-missing{background:var(--red-dim);color:var(--red)}
.ex-on-ext{background:var(--orange-dim);color:var(--orange)}
.ex-amend{background:var(--purple-dim);color:var(--purple)}
.ex-on-hold{background:var(--yellow-dim);color:var(--yellow)}
.ex-waiting-irs{background:var(--blue-dim);color:var(--blue)}
.card-footer{display:flex;align-items:center;gap:7px}
.priority-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.p-high{background:var(--red)}
.p-medium{background:var(--yellow)}
.p-low{background:var(--text-dim)}
.card-due{font-size:11px;color:var(--text-muted);flex:1}
.card-due.overdue{color:var(--red);font-weight:600}
.card-due.soon{color:var(--yellow);font-weight:500}
.card-note-count{
  font-size:10px;color:var(--text-dim);display:flex;align-items:center;gap:3px;
}
.preparer-avatar{
  width:22px;height:22px;border-radius:50%;
  background:var(--surface3);border:1px solid var(--border);
  font-size:9px;font-weight:700;color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;text-transform:uppercase;
}

/* Card hover actions */
.card-actions{
  display:none;
  padding:7px 10px 8px 14px;
  border-top:1px solid var(--border);
  gap:5px;flex-wrap:wrap;
}
.card:hover .card-actions{display:flex}
.card-action-btn{
  font-size:11px;font-weight:500;
  padding:3px 9px;border-radius:4px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
  transition:all .15s;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px;
}
.card-action-btn:hover{border-color:var(--border-h);color:var(--text)}
.card-action-btn.next-stage{border-color:rgba(91,106,240,.4);color:var(--accent);background:var(--accent-dim)}
.card-action-btn.next-stage:hover{background:rgba(91,106,240,.22)}

/* ─── LIST VIEW ─── */
.list-view{padding:16px;overflow:auto;flex:1}
.list-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.list-table th{
  background:var(--surface2);
  padding:9px 14px;font-size:11px;font-weight:600;letter-spacing:.4px;
  text-transform:uppercase;color:var(--text-muted);
  border-bottom:1px solid var(--border);
  white-space:nowrap;cursor:pointer;user-select:none;
  transition:color .15s;position:sticky;top:0;z-index:2;
}
.list-table th:hover{color:var(--text)}
.list-table th.sorted-asc::after{content:' ↑'}
.list-table th.sorted-desc::after{content:' ↓'}
.list-table td{
  padding:10px 14px;font-size:13px;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
.list-table tr:last-child td{border-bottom:none}
.list-table tr.list-row{cursor:pointer;transition:background .1s}
.list-table tr.list-row:hover td{background:var(--surface2)}
.stage-pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;
  white-space:nowrap;
}
.list-client-name{font-weight:600;color:var(--text)}
.list-type{font-size:11px;font-weight:700;color:var(--text-muted)}
.list-due.overdue{color:var(--red);font-weight:600}
.list-due.soon{color:var(--yellow);font-weight:500}

/* ─── MODAL OVERLAY ─── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:200;display:flex;align-items:flex-start;justify-content:center;
  padding:40px 20px;backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.overlay.open{opacity:1;pointer-events:all}
.modal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);width:100%;max-width:640px;
  max-height:calc(100vh - 80px);overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow);
  transform:translateY(-8px);transition:transform .2s;
}
.overlay.open .modal{transform:translateY(0)}
.modal-header{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;flex-shrink:0;
}
.modal-title{font-size:16px;font-weight:700;flex:1;color:var(--text)}
.modal-close{
  width:28px;height:28px;border-radius:6px;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text-muted);font-size:16px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;
}
.modal-close:hover{border-color:var(--border-h);color:var(--text)}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{
  padding:14px 20px;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}

/* Progress bar inside modal */
.stage-progress{margin-bottom:20px}
.stage-progress-label{font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}
.stage-steps{display:flex;gap:0;position:relative}
.stage-steps::before{
  content:'';position:absolute;top:12px;left:0;right:0;height:2px;
  background:var(--border);z-index:0;
}
.stage-step{
  display:flex;flex-direction:column;align-items:center;
  flex:1;position:relative;z-index:1;cursor:pointer;
  transition:opacity .15s;
}
.stage-step:hover{opacity:.8}
.step-dot{
  width:24px;height:24px;border-radius:50%;
  border:2px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:var(--text-dim);
  transition:all .2s;margin-bottom:4px;
}
.stage-step.done .step-dot{background:var(--green);border-color:var(--green);color:#fff}
.stage-step.current .step-dot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-dim)}
.step-label{font-size:9px;font-weight:500;color:var(--text-dim);text-align:center;line-height:1.3;max-width:52px}
.stage-step.done .step-label,.stage-step.current .step-label{color:var(--text-muted)}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);margin:0 -20px;padding:0 20px;gap:0;margin-bottom:16px;flex-shrink:0}
.tab-btn{
  padding:10px 16px;font-size:13px;font-weight:500;color:var(--text-muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;
  cursor:pointer;transition:color .15s,border-color .15s;
}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent)}
.tab-btn:hover:not(.active){color:var(--text)}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* Detail grid */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.detail-field{display:flex;flex-direction:column;gap:4px}
.detail-field.full{grid-column:1/-1}
.field-label{font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--text-dim)}
.field-value{font-size:13px;color:var(--text);font-weight:500}
.field-value.muted{color:var(--text-muted)}

/* Activity log */
.activity-list{display:flex;flex-direction:column;gap:0}
.activity-item{
  display:flex;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--border);
}
.activity-item:last-child{border-bottom:none}
.activity-dot{
  width:8px;height:8px;border-radius:50%;background:var(--text-dim);
  flex-shrink:0;margin-top:5px;
}
.activity-dot.note{background:var(--accent)}
.activity-dot.stage{background:var(--green)}
.activity-dot.create{background:var(--purple)}
.activity-content{flex:1;min-width:0}
.activity-text{font-size:13px;color:var(--text);line-height:1.5}
.activity-time{font-size:11px;color:var(--text-dim);margin-top:2px}
.add-note-area{margin-top:16px}
.note-textarea{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--text);
  resize:vertical;min-height:80px;transition:border-color .15s;line-height:1.5;
}
.note-textarea:focus{border-color:var(--accent)}
.note-textarea::placeholder{color:var(--text-dim)}

/* ─── FORM ─── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-field{display:flex;flex-direction:column;gap:6px}
.form-field.full{grid-column:1/-1}
.form-label{font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--text-dim)}
.form-input,.form-select,.form-textarea{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:8px 12px;
  font-size:13px;color:var(--text);
  transition:border-color .15s;
  width:100%;
}
.form-select{cursor:pointer}
.form-textarea{resize:vertical;min-height:70px;line-height:1.5}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-input::placeholder,.form-textarea::placeholder{color:var(--text-dim)}
.form-select option{background:var(--surface2)}
.form-check-row{display:flex;align-items:center;gap:8px;margin-top:2px}
.form-check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.form-check-label{font-size:13px;color:var(--text-muted)}

/* ─── CONFIRM DIALOG ─── */
.confirm-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  z-index:300;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .15s;
}
.confirm-overlay.open{opacity:1;pointer-events:all}
.confirm-box{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:24px;max-width:360px;width:90%;
  box-shadow:var(--shadow);text-align:center;
}
.confirm-box h3{font-size:16px;font-weight:700;margin-bottom:8px}
.confirm-box p{font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.6}
.confirm-btns{display:flex;gap:10px;justify-content:center}

/* ─── TOAST ─── */
.toasts{
  position:fixed;bottom:20px;right:20px;z-index:400;
  display:flex;flex-direction:column;gap:8px;
  pointer-events:none;
}
.toast{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r);padding:10px 16px;
  font-size:13px;font-weight:500;color:var(--text);
  box-shadow:var(--shadow);
  animation:toastIn .25s ease;pointer-events:all;
  display:flex;align-items:center;gap:8px;
}
.toast.success{border-left:3px solid var(--green)}
.toast.info{border-left:3px solid var(--accent)}
.toast.warn{border-left:3px solid var(--yellow)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* ─── EMPTY STATE ─── */
.empty-col{
  text-align:center;padding:24px 12px;color:var(--text-dim);
  font-size:12px;
}
.empty-list{
  text-align:center;padding:60px 20px;color:var(--text-muted);
}
.empty-list-icon{font-size:40px;margin-bottom:12px}
.empty-list-text{font-size:14px;font-weight:500;color:var(--text-muted)}

/* ─── RESPONSIVE / MISC ─── */
.main-area{display:flex;flex-direction:column;min-height:calc(100vh - var(--nav-h))}
.view-area{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ─────────────────────────────────────────────
   STATE
───────────────────────────────────────────── */
let returns = [];
let editingId = null;
let currentView = 'kanban';
let filters = { search:'', type:'', preparer:'', priority:'', exStatus:'', stat:'' };
let sortCol = 'client';
let sortDir = 'asc';
let collapsedCols = {};
let detailId = null;
let activeTab = 'details';
let dragId = null;
let dragOverCol = null;

/* ─────────────────────────────────────────────
   HELPERS
───────────────────────────────────────────── */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function today() {
  return new Date().toISOString().split('T')[0];
}

function formatDate(d) {
  if (!d) return '—';
  const [y, m, day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[+m-1]} ${+day}, ${y}`;
}

function dateDueSoon(d) {
  if (!d) return false;
  const diff = (new Date(d) - new Date()) / 86400000;
  return diff >= 0 && diff <= 30;
}

function dateOverdue(d) {
  if (!d) return false;
  return new Date(d) < new Date();
}

function initials(name) {
  if (!name) return '?';
  const words = name.trim().split(' ');
  if (words.length === 1) return words[0].slice(0,2).toUpperCase();
  return (words[0][0] + words[words.length-1][0]).toUpperCase();
}

function nextStage(currentId) {
  const idx = STAGES.findIndex(s => s.id === currentId);
  if (idx < 0 || idx >= STAGES.length - 1) return null;
  return STAGES[idx + 1].id;
}

function stageLabel(id) {
  return STAGES.find(s => s.id === id)?.label || id;
}

function exLabel(id) {
  return EX_LABELS[id] || '';
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(returns));
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length > 0) {
        returns = parsed;
        return;
      }
    }
  } catch(e) {}
  // seed
  returns = SEED.map(r => ({
    ...r,
    id: uid(),
    createdAt: new Date().toISOString(),
    activity: [
      { type: 'create', text: 'Return added to pipeline.', ts: new Date().toISOString() },
      ...(r.notes || []).map(n => ({ type: 'note', text: n, ts: new Date().toISOString() }))
    ],
  }));
  save();
}

function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

/* ─────────────────────────────────────────────
   FILTERS
───────────────────────────────────────────── */
function filteredReturns() {
  let r = returns;
  const yr = document.getElementById('yearFilter').value;
  if (yr) r = r.filter(x => x.year === yr);
  if (filters.search) {
    const q = filters.search.toLowerCase();
    r = r.filter(x =>
      x.client.toLowerCase().includes(q) ||
      (x.notes||[]).some(n => n.toLowerCase().includes(q)) ||
      (x.state||'').toLowerCase().includes(q) ||
      (x.preparer||'').toLowerCase().includes(q)
    );
  }
  if (filters.type) r = r.filter(x => x.type === filters.type);
  if (filters.preparer) r = r.filter(x => x.preparer === filters.preparer);
  if (filters.priority) r = r.filter(x => x.priority === filters.priority);
  if (filters.exStatus) r = r.filter(x => x.exStatus === filters.exStatus);
  if (filters.stat) {
    if (filters.stat === 'in-progress') r = r.filter(x => ['in-prep','in-review'].includes(x.stage));
    else if (filters.stat === 'waiting-client') r = r.filter(x => ['waiting-docs','waiting-sig','organizer-sent'].includes(x.stage));
    else if (filters.stat === 'waiting-irs') r = r.filter(x => x.exStatus === 'waiting-irs' || x.stage === 'filed');
    else if (filters.stat === 'filed') r = r.filter(x => x.stage === 'filed');
    else if (filters.stat === 'complete') r = r.filter(x => x.stage === 'complete');
  }
  return r;
}

function filterByStat(stat) {
  filters.stat = filters.stat === stat ? '' : stat;
  document.querySelectorAll('.stat-cell').forEach(el => {
    el.classList.toggle('active', el.dataset.stat === filters.stat);
  });
  render();
}

/* ─────────────────────────────────────────────
   STATS
───────────────────────────────────────────── */
function updateStats() {
  const yr = document.getElementById('yearFilter').value;
  let r = yr ? returns.filter(x => x.year === yr) : returns;
  document.getElementById('sStat').textContent = r.length;
  document.getElementById('ipStat').textContent = r.filter(x => ['in-prep','in-review'].includes(x.stage)).length;
  document.getElementById('wcStat').textContent = r.filter(x => ['waiting-docs','waiting-sig','organizer-sent'].includes(x.stage)).length;
  document.getElementById('wiStat').textContent = r.filter(x => x.exStatus === 'waiting-irs' || x.stage === 'filed').length;
  document.getElementById('filStat').textContent = r.filter(x => x.stage === 'filed').length;
  document.getElementById('compStat').textContent = r.filter(x => x.stage === 'complete').length;
  document.getElementById('totalCountNav').textContent = r.length;
}

/* ─────────────────────────────────────────────
   ATTENTION BANNER
───────────────────────────────────────────── */
function updateBanner() {
  if (sessionStorage.getItem(BANNER_DISMISS_KEY)) {
    document.getElementById('attentionBanner').classList.add('hidden');
    return;
  }
  const yr = document.getElementById('yearFilter').value;
  let r = yr ? returns.filter(x => x.year === yr) : returns;
  const attn = r.filter(x =>
    x.exStatus === 'missing-info' ||
    x.exStatus === 'on-hold' ||
    (x.priority === 'High' && ['organizer-sent','waiting-docs'].includes(x.stage))
  );
  const banner = document.getElementById('attentionBanner');
  if (!attn.length) { banner.classList.add('hidden'); return; }
  banner.classList.remove('hidden');
  document.getElementById('bannerLabel').textContent = `${attn.length} return${attn.length>1?'s':''} need${attn.length===1?'s':''} attention:`;
  const chips = document.getElementById('bannerChips');
  chips.innerHTML = '';
  attn.forEach(x => {
    const chip = document.createElement('span');
    chip.className = 'banner-chip' + (x.exStatus === 'missing-info' || x.exStatus === 'on-hold' ? ' red-chip' : '');
    chip.textContent = x.client;
    chip.onclick = () => openDetail(x.id);
    chips.appendChild(chip);
  });
}

document.getElementById('bannerDismiss').onclick = () => {
  sessionStorage.setItem(BANNER_DISMISS_KEY, '1');
  document.getElementById('attentionBanner').classList.add('hidden');
};

/* ─────────────────────────────────────────────
   CARD HTML
───────────────────────────────────────────── */
function cardHtml(r) {
  const dueCls = dateOverdue(r.dueDate) ? 'overdue' : dateDueSoon(r.dueDate) ? 'soon' : '';
  const noteCount = (r.activity||[]).filter(a=>a.type==='note').length;
  const stageColor = STAGE_COLORS[r.stage] || '#7b7fa8';

  let metaTags = '';
  if (r.year) metaTags += `<span class="meta-tag meta-year">${r.year}</span>`;
  if (r.state) metaTags += `<span class="meta-tag meta-state">${r.state}</span>`;
  if (r.extension) metaTags += `<span class="meta-tag meta-ext">EXT</span>`;
  if (r.exStatus) {
    const cls = {
      'missing-info':'ex-missing','on-extension':'ex-on-ext',
      'amendment':'ex-amend','on-hold':'ex-on-hold','waiting-irs':'ex-waiting-irs'
    }[r.exStatus]||'';
    metaTags += `<span class="meta-tag ex-tag ${cls}">${exLabel(r.exStatus)}</span>`;
  }

  const prCls = r.priority === 'High' ? 'p-high' : r.priority === 'Medium' ? 'p-medium' : 'p-low';
  const typeCls = `type-${r.type.toLowerCase().replace(/[^a-z0-9]/g,'')}`;

  const ns = nextStage(r.stage);

  return `
    <div class="card" data-id="${r.id}" style="--col-color:${stageColor}"
         draggable="true"
         onclick="handleCardClick(event,'${r.id}')"
         ondragstart="onDragStart(event,'${r.id}')"
         ondragend="onDragEnd(event)">
      <div class="card-main">
        <div class="card-top">
          <span class="type-badge ${typeCls}">${r.type}</span>
          <span class="card-name" title="${r.client}">${r.client}</span>
        </div>
        <div class="card-meta">${metaTags}</div>
        <div class="card-footer">
          <div class="priority-dot ${prCls}" title="${r.priority} priority"></div>
          <span class="card-due ${dueCls}">${formatDate(r.dueDate)}</span>
          ${noteCount ? `<span class="card-note-count">&#128221; ${noteCount}</span>` : ''}
          <div style="flex:1"></div>
          <div class="preparer-avatar" title="${r.preparer||'Unassigned'}">${r.preparer ? r.preparer.slice(0,2).toUpperCase() : '?'}</div>
        </div>
      </div>
      <div class="card-actions">
        ${ns ? `<button class="card-action-btn next-stage" onclick="advanceStage(event,'${r.id}')">&#8594; ${stageLabel(ns)}</button>` : ''}
        <button class="card-action-btn" onclick="openDetailTab(event,'${r.id}','activity')">&#128221; Note</button>
        <button class="card-action-btn" onclick="openEdit(event,'${r.id}')">&#9998; Edit</button>
      </div>
    </div>`;
}

/* ─────────────────────────────────────────────
   KANBAN RENDER
───────────────────────────────────────────── */
function renderKanban() {
  const filtered = filteredReturns();
  const byStage = {};
  STAGES.forEach(s => { byStage[s.id] = []; });
  filtered.forEach(r => {
    if (byStage[r.stage]) byStage[r.stage].push(r);
    else byStage['intake'] = byStage['intake'] || [];
  });

  let html = '<div class="kanban-wrapper" id="kanbanWrapper">';
  STAGES.forEach(s => {
    const cards = byStage[s.id] || [];
    const collapsed = collapsedCols[s.id] ? 'collapsed' : '';
    const color = STAGE_COLORS[s.id] || '#7b7fa8';
    html += `
      <div class="kanban-col col-${s.id} ${collapsed}" id="col-${s.id}"
           ondragover="onDragOver(event,'${s.id}')"
           ondragleave="onDragLeave(event,'${s.id}')"
           ondrop="onDrop(event,'${s.id}')">
        <div class="col-header" onclick="toggleColCollapse('${s.id}')">
          <div class="col-dot" style="background:${color}"></div>
          <span class="col-title">${s.label}</span>
          <span class="col-count">${cards.length}</span>
          <span class="col-collapse-btn">&#8963;</span>
        </div>
        <div class="col-body" id="body-${s.id}">
          ${cards.length === 0 ? '<div class="empty-col">No returns</div>' : ''}
          ${cards.map(r => cardHtml(r)).join('')}
        </div>
      </div>`;
  });
  html += '</div>';
  document.getElementById('viewArea').innerHTML = html;
}

function toggleColCollapse(stageId) {
  collapsedCols[stageId] = !collapsedCols[stageId];
  renderKanban();
}

/* ─────────────────────────────────────────────
   LIST RENDER
───────────────────────────────────────────── */
function renderList() {
  let filtered = filteredReturns();

  // sort
  filtered = filtered.slice().sort((a, b) => {
    let av = a[sortCol] || '';
    let bv = b[sortCol] || '';
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av < bv) return sortDir === 'asc' ? -1 : 1;
    if (av > bv) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  const cols = [
    { key:'client',   label:'Client' },
    { key:'type',     label:'Type' },
    { key:'year',     label:'Year' },
    { key:'stage',    label:'Stage' },
    { key:'exStatus', label:'Exception' },
    { key:'priority', label:'Priority' },
    { key:'preparer', label:'Preparer' },
    { key:'dueDate',  label:'Due Date' },
    { key:'state',    label:'State' },
  ];

  let html = `<div class="list-view"><table class="list-table"><thead><tr>`;
  cols.forEach(c => {
    const cls = sortCol === c.key ? (sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc') : '';
    html += `<th class="${cls}" onclick="sortBy('${c.key}')">${c.label}</th>`;
  });
  html += '</tr></thead><tbody>';

  if (!filtered.length) {
    html += `<tr><td colspan="${cols.length}" style="text-align:center;padding:40px;color:var(--text-muted)">No returns match the current filters.</td></tr>`;
  }

  filtered.forEach(r => {
    const stageColor = STAGE_COLORS[r.stage] || '#7b7fa8';
    const dueCls = dateOverdue(r.dueDate) ? 'overdue' : dateDueSoon(r.dueDate) ? 'soon' : '';
    const prCls = r.priority === 'High' ? 'p-high' : r.priority === 'Medium' ? 'p-medium' : 'p-low';
    const exHtml = r.exStatus ? `<span class="meta-tag ex-tag ${getExCls(r.exStatus)}">${exLabel(r.exStatus)}</span>` : '<span style="color:var(--text-dim)">—</span>';
    html += `
      <tr class="list-row" onclick="openDetail('${r.id}')">
        <td><span class="list-client-name">${r.client}</span></td>
        <td><span class="type-badge type-${r.type.toLowerCase().replace(/[^a-z0-9]/g,'')}">${r.type}</span></td>
        <td style="color:var(--text-muted)">${r.year}</td>
        <td><span class="stage-pill" style="background:${stageColor}22;color:${stageColor};border:1px solid ${stageColor}44"><span style="width:6px;height:6px;border-radius:50%;background:${stageColor};display:inline-block"></span>${stageLabel(r.stage)}</span></td>
        <td>${exHtml}</td>
        <td><span style="display:flex;align-items:center;gap:5px"><span class="priority-dot ${prCls}"></span>${r.priority}</span></td>
        <td style="color:var(--text-muted)">${r.preparer || '—'}</td>
        <td class="list-due ${dueCls}">${formatDate(r.dueDate)}</td>
        <td style="color:var(--text-muted)">${r.state || '—'}</td>
      </tr>`;
  });

  html += '</tbody></table></div>';
  document.getElementById('viewArea').innerHTML = html;
}

function getExCls(ex) {
  return {
    'missing-info':'ex-missing','on-extension':'ex-on-ext',
    'amendment':'ex-amend','on-hold':'ex-on-hold','waiting-irs':'ex-waiting-irs'
  }[ex] || '';
}

function sortBy(col) {
  if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortCol = col; sortDir = 'asc'; }
  renderList();
}

/* ─────────────────────────────────────────────
   MAIN RENDER
───────────────────────────────────────────── */
function render() {
  updateStats();
  updateBanner();
  if (currentView === 'kanban') renderKanban();
  else renderList();
}

/* ─────────────────────────────────────────────
   DRAG & DROP
───────────────────────────────────────────── */
function onDragStart(e, id) {
  dragId = id;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => {
    const el = document.querySelector(`[data-id="${id}"]`);
    if (el) el.classList.add('dragging');
  }, 0);
}

function onDragEnd(e) {
  dragId = null;
  dragOverCol = null;
  document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
  document.querySelectorAll('[data-id]').forEach(c => c.classList.remove('dragging'));
}

function onDragOver(e, stageId) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (dragOverCol !== stageId) {
    document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
    const col = document.getElementById(`col-${stageId}`);
    if (col) col.classList.add('drag-over');
    dragOverCol = stageId;
  }
}

function onDragLeave(e, stageId) {
  const col = document.getElementById(`col-${stageId}`);
  if (col && !col.contains(e.relatedTarget)) {
    col.classList.remove('drag-over');
    if (dragOverCol === stageId) dragOverCol = null;
  }
}

function onDrop(e, stageId) {
  e.preventDefault();
  if (!dragId) return;
  const r = returns.find(x => x.id === dragId);
  if (!r) return;
  const oldStage = r.stage;
  if (oldStage !== stageId) {
    r.stage = stageId;
    r.activity = r.activity || [];
    r.activity.push({ type: 'stage', text: `Moved from ${stageLabel(oldStage)} to ${stageLabel(stageId)}.`, ts: new Date().toISOString() });
    save();
    toast(`Moved to ${stageLabel(stageId)}`, 'success');
  }
  document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
  render();
}

/* ─────────────────────────────────────────────
   CARD ACTIONS
───────────────────────────────────────────── */
function handleCardClick(e, id) {
  if (e.target.closest('.card-action-btn')) return;
  openDetail(id);
}

function advanceStage(e, id) {
  e.stopPropagation();
  const r = returns.find(x => x.id === id);
  if (!r) return;
  const ns = nextStage(r.stage);
  if (!ns) return;
  const old = r.stage;
  r.stage = ns;
  r.activity = r.activity || [];
  r.activity.push({ type: 'stage', text: `Moved from ${stageLabel(old)} to ${stageLabel(ns)}.`, ts: new Date().toISOString() });
  save();
  toast(`${r.client} → ${stageLabel(ns)}`, 'success');
  render();
}

function openDetailTab(e, id, tab) {
  e.stopPropagation();
  openDetail(id, tab);
}

function openEdit(e, id) {
  e.stopPropagation();
  openEditModal(id);
}

      <div class="field-value">${formatDate(r.dueDate)}</div>
    </div>
    <div class="detail-field">
      <div class="field-label">Extension</div>
      <div class="field-value">${r.extension ? 'Yes' : 'No'}</div>
    </div>
    <div class="detail-field">
      <div class="field-label">Exception</div>
      <div class="field-value ${r.exStatus ? '' : 'muted'}">${r.exStatus ? exLabel(r.exStatus) : '—'}</div>
    </div>
  `;

  // Next stage button
  const ns = nextStage(r.stage);
  const nsBtn = document.getElementById('detailNextStage');
  if (ns) {
    nsBtn.textContent = `Move to ${stageLabel(ns)} →`;
    nsBtn.style.display = '';
  } else {
    nsBtn.style.display = 'none';
  }

  // Activity tab
  const activity = (r.activity || []).slice().reverse();
  const actHtml = activity.length === 0
    ? '<div style="color:var(--text-dim);font-size:13px;padding:16px 0">No activity yet.</div>'
    : activity.map(a => `
      <div class="activity-item">
        <div class="activity-dot ${a.type}"></div>
        <div class="activity-content">
          <div class="activity-text">${a.text}</div>
          <div class="activity-time">${formatTs(a.ts)}</div>
        </div>
      </div>`).join('');
  document.getElementById('activityList').innerHTML = actHtml;
  document.getElementById('noteInput').value = '';
}

function formatTs(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
}

function setStageFromProgress(stageId) {
  const r = returns.find(x => x.id === detailId);
  if (!r || r.stage === stageId) return;
  const old = r.stage;
  r.stage = stageId;
  r.activity = r.activity || [];
  r.activity.push({ type: 'stage', text: `Moved from ${stageLabel(old)} to ${stageLabel(stageId)}.`, ts: new Date().toISOString() });
  save();
  toast(`Moved to ${stageLabel(stageId)}`, 'success');
  renderDetailModal();
  render();
}

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTab = btn.dataset.tab;
    renderDetailModal();
  });
});

// Next stage in detail modal
document.getElementById('detailNextStage').onclick = () => {
  const r = returns.find(x => x.id === detailId);
  if (!r) return;
  const ns = nextStage(r.stage);
  if (!ns) return;
  setStageFromProgress(ns);
};

// Add note
document.getElementById('addNoteBtn').onclick = () => {
  const r = returns.find(x => x.id === detailId);
  if (!r) return;
  const text = document.getElementById('noteInput').value.trim();
  if (!text) return;
  r.activity = r.activity || [];
  r.activity.push({ type: 'note', text, ts: new Date().toISOString() });
  save();
  toast('Note added', 'success');
  renderDetailModal();
  render();
};

// Close detail
document.getElementById('detailClose').onclick = () => {
  document.getElementById('detailOverlay').classList.remove('open');
};
document.getElementById('detailOverlay').onclick = (e) => {
  if (e.target === document.getElementById('detailOverlay'))
    document.getElementById('detailOverlay').classList.remove('open');
};

// Edit from detail
document.getElementById('detailEditBtn').onclick = () => {
  document.getElementById('detailOverlay').classList.remove('open');
  openEditModal(detailId);
};

// Delete from detail
document.getElementById('detailDeleteBtn').onclick = () => {
  const r = returns.find(x => x.id === detailId);
  if (!r) return;
  openConfirm(
    'Delete Return?',
    `This will permanently delete "${r.client}" from the pipeline.`,
    () => {
      returns = returns.filter(x => x.id !== detailId);
      save();
      document.getElementById('detailOverlay').classList.remove('open');
      toast('Return deleted', 'warn');
      render();
    }
  );
};

/* ─────────────────────────────────────────────
   CONFIRM DIALOG
───────────────────────────────────────────── */
let confirmCallback = null;
function openConfirm(title, msg, cb) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent = msg;
  confirmCallback = cb;
  document.getElementById('confirmOverlay').classList.add('open');
}
document.getElementById('confirmOk').onclick = () => {
  document.getElementById('confirmOverlay').classList.remove('open');
  if (confirmCallback) { confirmCallback(); confirmCallback = null; }
};
document.getElementById('confirmCancel').onclick = () => {
  document.getElementById('confirmOverlay').classList.remove('open');
  confirmCallback = null;
};

/* ─────────────────────────────────────────────
   ADD / EDIT MODAL
───────────────────────────────────────────── */
function openAddModal() {
  editingId = null;
  document.getElementById('formTitle').textContent = 'Add Return';
  document.getElementById('formSave').textContent = 'Save Return';
  clearForm();
  document.getElementById('formOverlay').classList.add('open');
}

function openEditModal(id) {
  editingId = id;
  const r = returns.find(x => x.id === id);
  if (!r) return;
  document.getElementById('formTitle').textContent = 'Edit Return';
  document.getElementById('formSave').textContent = 'Save Changes';
  document.getElementById('f-client').value = r.client || '';
  document.getElementById('f-email').value = r.email || '';
  document.getElementById('f-type').value = r.type || '1040';
  document.getElementById('f-year').value = r.year || '2025';
  document.getElementById('f-stage').value = r.stage || 'intake';
  document.getElementById('f-priority').value = r.priority || 'Medium';
  document.getElementById('f-preparer').value = r.preparer || '';
  document.getElementById('f-reviewer').value = r.reviewer || '';
  document.getElementById('f-state').value = r.state || '';
  document.getElementById('f-due').value = r.dueDate || '';
  document.getElementById('f-exStatus').value = r.exStatus || '';
  document.getElementById('f-extension').checked = !!r.extension;
  document.getElementById('f-note').value = '';
  document.getElementById('formOverlay').classList.add('open');
}

function clearForm() {
  document.getElementById('f-client').value = '';
  document.getElementById('f-email').value = '';
  document.getElementById('f-type').value = '1040';
  document.getElementById('f-year').value = '2025';
  document.getElementById('f-stage').value = 'intake';
  document.getElementById('f-priority').value = 'Medium';
  document.getElementById('f-preparer').value = '';
  document.getElementById('f-reviewer').value = '';
  document.getElementById('f-state').value = '';
  document.getElementById('f-due').value = '';
  document.getElementById('f-exStatus').value = '';
  document.getElementById('f-extension').checked = false;
  document.getElementById('f-note').value = '';
}

document.getElementById('formSave').onclick = () => {
  const client = document.getElementById('f-client').value.trim();
  if (!client) { toast('Client name is required', 'warn'); return; }
  if (editingId) {
    const r = returns.find(x => x.id === editingId);
    if (!r) return;
    const oldStage = r.stage;
    const newStage = document.getElementById('f-stage').value;
    r.client    = client;
    r.email     = document.getElementById('f-email').value.trim();
    r.type      = document.getElementById('f-type').value;
    r.year      = document.getElementById('f-year').value;
    r.stage     = newStage;
    r.priority  = document.getElementById('f-priority').value;
    r.preparer  = document.getElementById('f-preparer').value;
    r.reviewer  = document.getElementById('f-reviewer').value;
    r.state     = document.getElementById('f-state').value.toUpperCase().trim();
    r.dueDate   = document.getElementById('f-due').value;
    r.exStatus  = document.getElementById('f-exStatus').value;
    r.extension = document.getElementById('f-extension').checked;
    r.activity  = r.activity || [];
    if (oldStage !== newStage) {
      r.activity.push({ type:'stage', text:`Moved from ${stageLabel(oldStage)} to ${stageLabel(newStage)}.`, ts: new Date().toISOString() });
    }
    const note = document.getElementById('f-note').value.trim();
    if (note) r.activity.push({ type:'note', text:note, ts: new Date().toISOString() });
    r.activity.push({ type:'edit', text:'Return details updated.', ts: new Date().toISOString() });
    save();
    toast('Changes saved', 'success');
  } else {
    const note = document.getElementById('f-note').value.trim();
    const r = {
      id:        uid(),
      client,
      email:     document.getElementById('f-email').value.trim(),
      type:      document.getElementById('f-type').value,
      year:      document.getElementById('f-year').value,
      stage:     document.getElementById('f-stage').value,
      priority:  document.getElementById('f-priority').value,
      preparer:  document.getElementById('f-preparer').value,
      reviewer:  document.getElementById('f-reviewer').value,
      state:     document.getElementById('f-state').value.toUpperCase().trim(),
      dueDate:   document.getElementById('f-due').value,
      exStatus:  document.getElementById('f-exStatus').value,
      extension: document.getElementById('f-extension').checked,
      createdAt: new Date().toISOString(),
      activity:  [
        { type:'create', text:'Return added to pipeline.', ts: new Date().toISOString() },
        ...(note ? [{ type:'note', text:note, ts: new Date().toISOString() }] : [])
      ],
    };
    returns.push(r);
    save();
    toast(`${client} added`, 'success');
  }
  document.getElementById('formOverlay').classList.remove('open');
  render();
};

document.getElementById('formClose').onclick = () => { document.getElementById('formOverlay').classList.remove('open'); };
document.getElementById('formCancel').onclick = () => { document.getElementById('formOverlay').classList.remove('open'); };
document.getElementById('formOverlay').onclick = (e) => {
  if (e.target === document.getElementById('formOverlay'))
    document.getElementById('formOverlay').classList.remove('open');
};

/* ─────────────────────────────────────────────
   EXPORT CSV
───────────────────────────────────────────── */
function exportCsv() {
  const yr = document.getElementById('yearFilter').value;
  const rows = yr ? returns.filter(x => x.year === yr) : returns;
  const headers = ['Client','Email','Type','Year','Stage','Priority','Preparer','Reviewer','State','Due Date','Extension','Exception','Notes'];
  const lines = [headers.join(',')];
  rows.forEach(r => {
    const notes = (r.activity||[]).filter(a=>a.type==='note').map(a=>a.text).join(' | ').replace(/,/g,';');
    lines.push([
      `"${r.client}"`,
      `"${r.email||''}"`,
      r.type, r.year,
      stageLabel(r.stage),
      r.priority,
      r.preparer||'',
      r.reviewer||'',
      r.state||'',
      r.dueDate||'',
      r.extension?'Yes':'No',
      exLabel(r.exStatus)||'',
      `"${notes}"`,
    ].join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `track-pipeline-${yr||'all'}.csv`;
  a.click();
  toast('CSV exported', 'info');
}

/* ─────────────────────────────────────────────
   VIEW TOGGLE
───────────────────────────────────────────── */
document.getElementById('kanbanViewBtn').onclick = () => {
  currentView = 'kanban';
  document.getElementById('kanbanViewBtn').classList.add('active');
  document.getElementById('listViewBtn').classList.remove('active');
  render();
};
document.getElementById('listViewBtn').onclick = () => {
  currentView = 'list';
  document.getElementById('listViewBtn').classList.add('active');
  document.getElementById('kanbanViewBtn').classList.remove('active');
  render();
};

/* ─────────────────────────────────────────────
   FILTERS WIRING
───────────────────────────────────────────── */
document.getElementById('searchInput').addEventListener('input', (e) => {
  filters.search = e.target.value;
  render();
});
document.getElementById('typeFilter').addEventListener('change', (e) => {
  filters.type = e.target.value;
  e.target.classList.toggle('active', !!e.target.value);
  render();
});
document.getElementById('preparerFilter').addEventListener('change', (e) => {
  filters.preparer = e.target.value;
  e.target.classList.toggle('active', !!e.target.value);
  render();
});
document.getElementById('priorityFilter').addEventListener('change', (e) => {
  filters.priority = e.target.value;
  e.target.classList.toggle('active', !!e.target.value);
  render();
});
document.getElementById('exFilter').addEventListener('change', (e) => {
  filters.exStatus = e.target.value;
  e.target.classList.toggle('active', !!e.target.value);
  render();
});
document.getElementById('yearFilter').addEventListener('change', () => render());

/* ─────────────────────────────────────────────
   KEYBOARD SHORTCUTS
───────────────────────────────────────────── */
document.addEventListener('keydown', (e) => {
  // Cmd/Ctrl+N = new return
  if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
    e.preventDefault();
    openAddModal();
    return;
  }
  // Escape = close top modal
  if (e.key === 'Escape') {
    if (document.getElementById('confirmOverlay').classList.contains('open')) {
      document.getElementById('confirmOverlay').classList.remove('open');
    } else if (document.getElementById('formOverlay').classList.contains('open')) {
      document.getElementById('formOverlay').classList.remove('open');
    } else if (document.getElementById('detailOverlay').classList.contains('open')) {
      document.getElementById('detailOverlay').classList.remove('open');
    }
  }
});

/* ─────────────────────────────────────────────
   BUTTON WIRING
───────────────────────────────────────────── */
document.getElementById('addBtn').onclick = openAddModal;
document.getElementById('exportBtn').onclick = exportCsv;

/* ─────────────────────────────────────────────
   INIT
───────────────────────────────────────────── */
load();
render();
</script>
</body>
</html>
